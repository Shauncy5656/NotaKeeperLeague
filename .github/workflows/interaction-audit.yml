name: NotaKeeper Interaction Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/interaction-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/nkl-server.log 2>&1 &
          sleep 2
      - name: Audit mobile interactions
        shell: bash
        run: |
          cat > /tmp/audit.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const out=[]; const log=(...x)=>out.push(x.join(' '));
            let browser;
            try{
              browser=await chromium.launch({headless:true});
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const consoleErrors=[]; const pageErrors=[];
              page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
              page.on('pageerror',e=>pageErrors.push(e.message));
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
              await page.waitForTimeout(800);
              log('TITLE',await page.title());
              log('VERSION_BADGE',JSON.stringify(await page.locator('.versionStamp').allTextContents()));
              const tabs=['draft','players','teams','setup','board'];
              for(const name of tabs){
                const tab=page.locator(`.tab[data-view="${name}"]`).first();
                if(!(await tab.count())){log('TAB_MISSING',name);continue;}
                let ok=true,err='';
                try{await tab.tap({timeout:3000});await page.waitForTimeout(180);}catch(e){ok=false;err=e.message.split('\n')[0];}
                const active=await page.evaluate(n=>{
                  const aliases={draft:['draft'],players:['players'],teams:['teams'],setup:['setup','settings'],board:['board']};
                  return (aliases[n]||[]).some(id=>document.getElementById(id)?.classList.contains('active'));
                },name);
                log('TAB',name,'tap='+ok,'active='+active,err);
              }
              // Audit controls on each core view after selecting it.
              for(const name of tabs){
                const tab=page.locator(`.tab[data-view="${name}"]`).first();
                if(await tab.count()) { try{await tab.tap();}catch{} await page.waitForTimeout(150); }
                const data=await page.evaluate(()=>{
                  const root=document.querySelector('.view.active'); if(!root)return {active:null,controls:[]};
                  const els=[...root.querySelectorAll('button,select,input:not([type=file]),[role=button]')].filter(el=>{
                    const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
                    return r.width>2&&r.height>2&&cs.display!=='none'&&cs.visibility!=='hidden'&&!el.disabled;
                  });
                  return {active:root.id,controls:els.map(el=>{
                    const r=el.getBoundingClientRect();
                    const x=Math.max(0,Math.min(innerWidth-1,r.left+r.width/2));
                    const y=Math.max(0,Math.min(innerHeight-1,r.top+r.height/2));
                    const hit=document.elementFromPoint(x,y);
                    return {id:el.id||'',tag:el.tagName,text:(el.textContent||el.value||el.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,65),blocked:!(hit===el||el.contains(hit)),hit:hit?`${hit.tagName}#${hit.id||''}.${typeof hit.className==='string'?hit.className:''}`:'none',onclick:typeof el.onclick==='function'};
                  })};
                });
                log('VIEW',name,'ACTIVE',data.active,'CONTROLS',JSON.stringify(data.controls));
              }
              // Explicitly exercise non-destructive controls that should react.
              const checks=[];
              async function selectView(v){const t=page.locator(`.tab[data-view="${v}"]`).first();if(await t.count()){await t.tap();await page.waitForTimeout(120)}}
              await selectView('players');
              const psearch=page.locator('#playerSearch,#search').first(); checks.push(['player-search',await psearch.count(),await psearch.isVisible().catch(()=>false)]);
              await selectView('setup');
              for(const id of ['runReadinessBtn','saveNames','exportBackup','resetSnakeDraft']){const e=page.locator('#'+id).first();checks.push([id,await e.count(),await e.isVisible().catch(()=>false),await e.isEnabled().catch(()=>false)]);}
              await selectView('board'); const db=page.locator('#draftBoard').first(); checks.push(['draftBoard',await db.count(),await db.isVisible().catch(()=>false)]);
              log('CHECKS',JSON.stringify(checks));
              log('PAGE_ERRORS',JSON.stringify(pageErrors));
              log('CONSOLE_ERRORS',JSON.stringify(consoleErrors));
            }catch(e){log('AUDIT_FATAL',e.stack||e.message||String(e));}
            finally{if(browser)await browser.close().catch(()=>{});require('fs').writeFileSync('interaction-audit-report.txt',out.join('\n')+'\n');}
          })();
          JS
          node /tmp/audit.js || true
          cat interaction-audit-report.txt
      - name: Publish audit report
        run: |
          git config user.name "NotaKeeper QA"
          git config user.email "actions@users.noreply.github.com"
          git add interaction-audit-report.txt
          git commit -m "Publish mobile interaction audit report" || exit 0
          git push origin main
