name: Apply Aug 30 Research Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-refresh-2026-08-30.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update research overlay only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('research-refresh-v3.json')
          data = json.loads(path.read_text())
          data['version'] = '3.0-2026-08-30'
          data['updatedAt'] = '2026-08-30T17:56:00Z'

          new_sources = [
            {
              'label': 'NFL: Preseason Week 3 Saturday — Keenan Allen sharp in Colts debut; Zavion Thomas posts 5-140-1 (Aug. 29)',
              'url': 'https://www.nfl.com/news/2026-nfl-preseason-week-3-what-we-learned-from-saturday-s-games'
            },
            {
              'label': 'FantasyPros: Real-Time ADP — Chuba Hubbard, TreVeyon Henderson, Josh Jacobs falling; Diggs/Parker Washington rising (Aug. 30)',
              'url': 'https://www.fantasypros.com/2026/08/30-fantasy-football-adp-risers-fallers-2026/'
            },
            {
              'label': 'NBC Sports: George Kittle has had no Achilles setback and is expected back at practice this week (Aug. 30)',
              'url': 'https://www.nbcsports.com/fantasy/football/player-news/2026-08-30/schefter-no-setbacks-for-george-kittle-achilles'
            },
            {
              'label': 'FantasyPros: Todd Bowles hopeful Emeka Egbuka will be ready for Week 1 (Aug. 29)',
              'url': 'https://www.fantasypros.com/nfl/news/604651/emeka-egbuka-toe-hopeful-week-1.php'
            }
          ]
          existing_urls = {s.get('url') for s in data.get('sources', [])}
          for src in new_sources:
            if src['url'] not in existing_urls:
              data.setdefault('sources', []).append(src)

          players = data.setdefault('players', [])
          by_name = {p.get('name'): p for p in players}

          updates = {
            'George Kittle': {
              'researchDelta': 0.9,
              'confidenceDelta': 3,
              'priceCeilingDelta': -4,
              'note': 'Kittle has had no setback in his Achilles recovery and is expected to practice this week, which strengthens his early-season availability case. Keep the upgrade modest because Week 1 in Australia is still not guaranteed and a post-Achilles ramp-up remains likely.'
            },
            'Emeka Egbuka': {
              'researchDelta': -0.4,
              'confidenceDelta': -2,
              'priceCeilingDelta': 2,
              'note': 'Todd Bowles is now hopeful Egbuka will be ready for Week 1, improving the outlook after nearly two weeks of missed team drills. Retain a small toe-injury/ramp-up discount until full practice participation is confirmed.'
            },
            'Chuba Hubbard': {
              'researchDelta': -0.8,
              'confidenceDelta': -2,
              'priceCeilingDelta': 4,
              'note': 'Week 1 availability is still expected, but current market movement and 2025 efficiency context add role risk: Hubbard ranked at or near the bottom of qualifying backs in missed-tackle rate, explosive-run rate and yards after contact, while Jonathon Brooks has earned first-team work. Keep this a modest role/efficiency downgrade rather than an injury-only fade.'
            },
            'Jonathon Brooks': {
              'researchDelta': 1.2,
              'confidenceDelta': 3,
              'priceCeilingDelta': -4,
              'note': 'Brooks continues to gain market support while Hubbard carries both a hamstring ramp-up and weak 2025 efficiency profile. Preserve only a modest upgrade because Dave Canales has indicated the backs will rotate rather than guaranteeing Brooks a full takeover.'
            },
            'Zavion Thomas': {
              'researchDelta': 0.6,
              'confidenceDelta': 1,
              'priceCeilingDelta': -2,
              'note': 'Thomas produced 140 receiving yards and a 97-yard touchdown on five catches in the preseason finale and added a 39-yard punt return, confirming elite field-stretching speed. Keep the bump small because the performance came largely against reserve competition and his regular-season offensive role remains uncertain.'
            }
          }
          for name, vals in updates.items():
            if name in by_name:
              by_name[name].update(vals)
            else:
              players.append({'name': name, **vals})

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Validate JSON and guard index
        run: |
          python3 -m json.tool research-refresh-v3.json >/dev/null
          git diff --exit-code -- index.html
          grep -q '3.0-2026-08-30' research-refresh-v3.json
      - name: Commit refresh and remove installer
        run: |
          rm .github/workflows/research-refresh-2026-08-30.yml
          git config user.name "NotaKeeper Research Updater"
          git config user.email "actions@users.noreply.github.com"
          git add research-refresh-v3.json .github/workflows/research-refresh-2026-08-30.yml
          git commit -m "Refresh research overlay for Aug 30"
          git push origin main
