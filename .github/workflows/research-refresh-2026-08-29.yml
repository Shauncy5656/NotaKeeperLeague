name: Apply NotaKeeper Research Refresh 2026-08-29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-refresh-2026-08-29.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update research overlay only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('research-refresh-v3.json')
          data = json.loads(path.read_text())
          data['version'] = '3.0-2026-08-29'
          data['updatedAt'] = '2026-08-29T17:55:00Z'

          new_sources = [
            {
              'label': 'NFL: Raiders coach says Jeanty/Washington both preparing to play a lot; Washington ran solely with first team in finale (Aug. 28-29)',
              'url': 'https://www.nfl.com/news/raiders-klint-kubiak-really-excited-about-ashton-jeanty-mike-washington-jr'
            },
            {
              'label': 'NFL: Preseason Week 3 Friday role takeaways — Chris Bell priority usage, Makai Lemon debut, Giants RB split (Aug. 29)',
              'url': 'https://www.nfl.com/news/2026-nfl-preseason-week-3-what-we-learned-friday-games'
            },
            {
              'label': 'Eagles: Makai Lemon fully healthy after preseason debut; coaching staff expects to count on him in 2026 (Aug. 29)',
              'url': 'https://www.philadelphiaeagles.com/news/makai-lemon-learns-plenty-from-preseason-debut'
            },
            {
              'label': 'FantasyPros: 13 current injuries to monitor, including Kraft/Egbuka/Jeanty and Week 1 availability updates (Aug. 29)',
              'url': 'https://www.fantasypros.com/2026/08/13-fantasy-football-injuries-to-monitor-2026/'
            },
            {
              'label': 'FantasyPros: Real-Time ADP risers/fallers — Washington/Lloyd/Olave rising; Jeanty/Tyson/Tracy falling (Aug. 29)',
              'url': 'https://www.fantasypros.com/2026/08/15-fantasy-football-adp-risers-fallers-2026/'
            }
          ]
          existing_urls = {s.get('url') for s in data.get('sources', [])}
          for src in new_sources:
            if src['url'] not in existing_urls:
              data.setdefault('sources', []).append(src)
              existing_urls.add(src['url'])

          updates = {
            'Ashton Jeanty': {
              'researchDelta': -1.5,
              'confidenceDelta': -5,
              'priceCeilingDelta': 8,
              'note': "Jeanty is still on the mend from the ankle sprain with Week 1 not yet confirmed, while Mike Washington Jr. handled all first-team work in the preseason finale and Klint Kubiak said both backs are preparing to play a lot. Keep Jeanty as the clear talent lead but trim early workload certainty modestly."
            },
            'Mike Washington Jr.': {
              'researchDelta': 2.3,
              'confidenceDelta': 4,
              'priceCeilingDelta': -8,
              'note': "Washington ran 8 times for 49 yards with the first team in the finale after earlier preseason bursts of 53 and 33 yards. Kubiak now says both Washington and Jeanty are preparing to play a lot, giving Washington some standalone role value in addition to elite handcuff upside."
            },
            'Makai Lemon': {
              'researchDelta': -0.2,
              'confidenceDelta': 0,
              'priceCeilingDelta': 2,
              'note': "Lemon is now fully healthy and drew five targets in 17 offensive snaps in his preseason debut, with Nick Sirianni saying the Eagles expect to count on him this year. The drop that became an interception and a muffed punt keep the adjustment neutral-to-slightly cautious rather than a full upgrade."
            },
            'Tucker Kraft': {
              'researchDelta': 0.6,
              'confidenceDelta': 2,
              'priceCeilingDelta': -3,
              'note': "Kraft has progressed from ACL rehab into 11-on-11 work and is now expected to be a full participant for Week 1. Restore a modest portion of the injury discount while retaining normal post-ACL early-season caution."
            },
            'Chris Bell': {
              'researchDelta': 1.1,
              'confidenceDelta': 2,
              'priceCeilingDelta': -4,
              'note': "Miami made Bell a clear preseason-finale priority, targeting him five times on the first three possessions, and NFL reporting described him as a player the Dolphins expect to feature in the passing game. Reward the role signal modestly while keeping rookie/quarterback uncertainty intact."
            },
            'Emeka Egbuka': {
              'researchDelta': -0.7,
              'confidenceDelta': -3,
              'priceCeilingDelta': 4,
              'note': "Egbuka's toe sprain has now kept him out of team drills for close to two weeks. Week 1 is still the expectation, so only deepen the temporary availability discount slightly rather than changing the season-long role projection."
            },
            'Chris Olave': {
              'researchDelta': 0.7,
              'confidenceDelta': 2,
              'priceCeilingDelta': -3,
              'note': "Jordyn Tyson's hamstring absence into roughly October leaves Olave as New Orleans' unquestioned early-season passing-game focal point. His 2025 WR7 points-per-game finish and top-ten target-share/yardage profile support a modest volume-confidence upgrade without chasing the ADP rise."
            }
          }

          players = data.setdefault('players', [])
          by_name = {p.get('name'): p for p in players}
          for name, vals in updates.items():
            if name in by_name:
              by_name[name].update(vals)
            else:
              players.append({'name': name, **vals})

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Validate only research file changed
        run: |
          python3 -m json.tool research-refresh-v3.json >/dev/null
          test "$(python3 - <<'PY'
          import json
          print(json.load(open('research-refresh-v3.json'))['version'])
          PY
          )" = "3.0-2026-08-29"
          git diff --exit-code -- index.html
      - name: Commit refresh and remove one-time workflow
        run: |
          rm .github/workflows/research-refresh-2026-08-29.yml
          git config user.name "NotaKeeper Research Updater"
          git config user.email "actions@users.noreply.github.com"
          git add research-refresh-v3.json .github/workflows/research-refresh-2026-08-29.yml
          git commit -m "Refresh NotaKeeper research overlay for Aug 29"
          git push origin main
